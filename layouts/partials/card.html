<article class="story {{ if not .Params.featured }}story-text{{ end }}"><div class="story-date"><time datetime="{{ .Date.Format `2006-01-02` }}">{{ .Date.Format "2006.01.02" }}</time>{{ with .Params.categories }}<span>{{ index . 0 }}</span>{{ end }}</div><div class="story-copy"><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p>{{ .Description | truncate 115 }}</p></div>{{ with .Params.featured }}<a class="story-image" href="{{ $.RelPermalink }}" tabindex="-1" aria-hidden="true"><img src="{{ . | relURL }}" alt="" loading="lazy"></a>{{ end }}</article>
