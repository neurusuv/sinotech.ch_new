name: Build and deploy Hugo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install Hugo
        env:
          HUGO_VERSION: 0.166.0
        run: |
          mkdir -p "$RUNNER_TEMP/hugo"
          curl --fail --location --silent --show-error "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP/hugo"
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: Build website
        env:
          TZ: Europe/Zurich
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
